name: Gym Booking Automation

on:
  #schedule: #Removed schedule and set in GAS samba instead.
  #  - cron: '15 8 * * *'
  workflow_dispatch: # Triggered by the Google Apps Script, or manually for testing
    inputs:
      dry_run:
        description: "Dry run: log what would be booked, but don't book"
        type: boolean
        default: false
      test_any_class:
        description: "TEST: use ANY class ~72h away (ignores clases.yaml). Books for real unless dry run is also ticked"
        type: boolean
        default: false
      window_hours:
        description: "TEST ONLY: look at classes this many hours away, e.g. 45-55. Leave EMPTY normally"
        type: string
        default: ""
      list_classes:
        description: "TEST ONLY: list classes in the window_hours range with their IDs (books nothing)"
        type: boolean
        default: false
      only_class_id:
        description: "TEST ONLY: book just this one class ID (use with TEST ticked). Leave EMPTY normally"
        type: string
        default: ""
      cancel_class_id:
        description: "CANCEL: class ID (from the Telegram message) to cancel for all members. Leave empty normally"
        type: string
        default: ""

jobs:
  book:
    runs-on: ubuntu-latest
    # The script now waits for 10:30:00 and may retry for ~10 minutes
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml

    - name: Create Temporary Config File
      run: |
        {
          echo "accounts:"
          echo "  - email: '${{ secrets.TRAININGYM_EMAIL }}'"
          echo "    password: '${{ secrets.TRAININGYM_PASSWORD }}'"
          echo "  - email: '${{ secrets.TRAININGYM_EMAIL_2 }}'"
          echo "    password: '${{ secrets.TRAININGYM_PASSWORD_2 }}'"
          echo "  - email: '${{ secrets.TRAININGYM_EMAIL_3 }}'"
          echo "    password: '${{ secrets.TRAININGYM_PASSWORD_3 }}'"
          echo "telegram: ${{ secrets.TELEGRAM_TO }}"
          echo "telegram_bot: '${{ secrets.TELEGRAM_TOKEN }}'"
        } > config.yaml

    - name: Run booking script and send alert
      run: |
        ARGS=""
        if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
        if [ "${{ inputs.test_any_class }}" = "true" ]; then ARGS="$ARGS --test-any-class"; fi
        WINDOW="${{ inputs.window_hours }}"
        if [ -n "$WINDOW" ]; then ARGS="$ARGS --window $WINDOW"; fi
        if [ "${{ inputs.list_classes }}" = "true" ]; then ARGS="$ARGS --list-classes"; fi
        ONLY="${{ inputs.only_class_id }}"
        if [ -n "$ONLY" ]; then ARGS="$ARGS --only-id $ONLY"; fi
        CANCEL_ID="${{ inputs.cancel_class_id }}"
        if [ -n "$CANCEL_ID" ]; then ARGS="--cancel-id $CANCEL_ID"; fi
        python main.py $ARGS | python send.py
